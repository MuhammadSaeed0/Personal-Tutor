name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    services:
      # A throw-away SQL Server for the integration tests only (the app itself runs on a normal local SQL Server).
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Only-Passw0rd!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-Passw0rd!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      RIWAQ_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Ci-Only-Passw0rd!;TrustServerCertificate=True
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/Riwaq.slnx
      - name: Build
        run: dotnet build backend/Riwaq.slnx --no-restore -c Release
      - name: Test
        run: dotnet test backend/Riwaq.slnx --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (i18n + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Translations complete in Arabic and English
        run: npm run check:i18n
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build
